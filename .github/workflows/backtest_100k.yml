        run: |
          mkdir -p scripts
          echo "$RUNNER_B64" | base64 --decode > scripts/backfill_and_backtest_100k.py
          python -m py_compile scripts/backfill_and_backtest_100k.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Backfill 2021-present cache and run portfolio backtest
        env:
          PYTHONPATH: .
        run: python scripts/backfill_and_backtest_100k.py --start-date 20210101 --end-date "${{ inputs.end_date }}"
      - name: Upload cache and reports
        uses: actions/upload-artifact@v4
        with:
          name: lianghua-backtest-100k-${{ inputs.end_date }}
          path: |
            results/stock_cache/
            results/backtest_100k/
          retention-days: 14
